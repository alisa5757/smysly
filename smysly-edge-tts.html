        const W = {
          en: /\b(the|and|is|are|of|to|in|that|it|you|for|with|this|not)\b/g,
          es: /\b(el|la|los|las|de|que|y|en|un|una|por|con|para|es|se|no|lo|como)\b/g,
          fr: /\b(le|la|les|des|du|et|est|une|un|que|pas|pour|dans|qui|sur|ce|il|je|vous|nous)\b/g
        };
        const sc = {};
        for (const k in W) sc[k] = (t.match(W[k]) || []).length;
        sc.es += (t.match(/[ñ¿¡]/g) || []).length * 3 + (t.match(/[áíóú]/g) || []).length;
        sc.fr += (t.match(/[àâçèêëîïôùûœ]/g) || []).length * 2;
        return Object.keys(sc).sort((a, b) => sc[b] - sc[a])[0];
      }

      const langOf = (v) => {
        const m = String(v.lang || "").toLowerCase().replace("_", "-").slice(0, 2);
        return LANG_BCP[m] ? m : "";
      };
      const sysScore = (v) => {
        const n = `${v.name} ${v.voiceURI}`;
        return (/premium|премиум/i.test(n) ? 5 : /enhanced|улучшен/i.test(n) ? 4 : /siri/i.test(n) ? 3 : 0)
          + (/dmitry|дмитрий/i.test(n) ? 6 : /natural|online/i.test(n) ? 3 : 0)
          + (/yuri|юрий|milena|милена|katya|катя|thomas|amélie|amelie|monica|mónica|paulina|samantha|daniel/i.test(n) ? 2 : 0);
      };
      // Лучший системный голос (iOS / Edge / ОС) нужного языка; выбранный пользователем — в приоритете
      function pickSystemVoice(lang) {
        const vs = getAvailableVoices().filter(v => langOf(v) === lang);
        if (!vs.length) return null;
        const pref = state.settings.ttsVoiceURI;
        return vs.find(v => v.voiceURI === pref || v.name === pref) || vs.sort((a, b) => sysScore(b) - sysScore(a))[0];
      }

      function getActiveVoiceLabel() {
        const pref = state.settings.ttsVoiceURI || "auto";
        const edgeName = pref === "dmitry" ? EDGE_DEFAULT.ru : pref.startsWith("edge:") ? pref.slice(5) : "";
        if (state.settings.ttsCloud !== false && (pref === "auto" || edgeName)) {
          const e = EDGE_VOICES.find(x => x[1] === (edgeName || EDGE_DEFAULT.ru));
          return `☁ Edge · ${e ? e[2] : "Дмитрий"}${pref === "auto" ? " (авто)" : ""}`;
        }
        const v = getAvailableVoices().find(x => x.voiceURI === pref || x.name === pref) || pickSystemVoice("ru");
        return v ? v.name.replace(/^Microsoft\s+/i, "MS ").replace(/\s*-\s*Russian\s*\(Russia\)/i, "") : "системный голос";
      }

      function buildVoiceOptionsHtml() {
        const p = state.settings.ttsVoiceURI || "auto";
        const cur = p === "dmitry" ? "edge:" + EDGE_DEFAULT.ru : p;
        const opt = (val, label) => `<option value="${esc(val)}"${cur === val ? " selected" : ""}>${esc(label)}</option>`;
        const out = [opt("auto", "Авто — Edge Дмитрий / голос по языку текста")];
        const all = getAvailableVoices();
        for (const l of ["ru", "en", "es", "fr"]) {
          out.push(`<optgroup label="${LANG_NAME[l]} · ☁ Microsoft Edge (поток)">${
            EDGE_VOICES.filter(x => x[0] === l).map(x => opt("edge:" + x[1], `${x[2]} · ${x[3]} · Neural`)).join("")
          }</optgroup>`);
          const seen = new Set();
          const sys = all
            .filter(v => langOf(v) === l && !seen.has(v.voiceURI || v.name) && seen.add(v.voiceURI || v.name))
            .sort((a, b) => sysScore(b) - sysScore(a))
            .map(v => opt(v.voiceURI || v.name, `${v.name} (${v.lang})`)).join("");
          if (sys) out.push(`<optgroup label="${LANG_NAME[l]} · 📱 системные${isIOSDevice() ? " (iOS)" : ""}">${sys}</optgroup>`);
        }
        return out.join("");
      }

      // ——— SHA-256 (запасной вариант там, где нет crypto.subtle, например file:// в Safari) ———
      function sha256hex(str) {
        const K = [], H = [];
        for (let c = 2, n = 0; n < 64; c++) {
          let p = 1;
          for (let d = 2; d * d <= c; d++) if (c % d === 0) { p = 0; break; }
          if (p) { if (n < 8) H[n] = (Math.pow(c, 0.5) % 1) * 4294967296 | 0; K[n++] = (Math.pow(c, 1 / 3) % 1) * 4294967296 | 0; }
        }
        const m = [...new TextEncoder().encode(str)], bits = m.length * 8;
        m.push(128);
        while (m.length % 64 !== 56) m.push(0);
        for (let i = 7; i >= 0; i--) m.push(i > 3 ? 0 : (bits >>> (i * 8)) & 255);
        let h = H.slice();
        const w = new Array(64);
        for (let o = 0; o < m.length; o += 64) {
          for (let i = 0; i < 16; i++) w[i] = (m[o + 4 * i] << 24) | (m[o + 4 * i + 1] << 16) | (m[o + 4 * i + 2] << 8) | m[o + 4 * i + 3];
          for (let i = 16; i < 64; i++) {
            const a = w[i - 15], b = w[i - 2];
            w[i] = (w[i - 16] + (((a >>> 7) | (a << 25)) ^ ((a >>> 18) | (a << 14)) ^ (a >>> 3)) + w[i - 7] + (((b >>> 17) | (b << 15)) ^ ((b >>> 19) | (b << 13)) ^ (b >>> 10))) | 0;
          }
          let [a, b, c, d, e, f, g, x] = h;
          for (let i = 0; i < 64; i++) {
            const t1 = (x + (((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7))) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
            const t2 = ((((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10))) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
            x = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
          }
          h = [h[0] + a | 0, h[1] + b | 0, h[2] + c | 0, h[3] + d | 0, h[4] + e | 0, h[5] + f | 0, h[6] + g | 0, h[7] + x | 0];
        }
        return h.map(v => (v >>> 0).toString(16).padStart(8, "0")).join("").toUpperCase();
      }

      // Токен Sec-MS-GEC: SHA-256 от «время в тиках Windows, округлённое до 5 минут + TrustedClientToken»
      async function edgeGec() {
        let t = Math.floor(Date.now() / 1000) + 11644473600;
        t -= t % 300;
        const s = t + "0000000" + EDGE_CFG.token;
        try {
          if (globalThis.crypto?.subtle) {
            const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
            return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("").toUpperCase();
          }
        } catch {}
        return sha256hex(s);
      }

      const rid = () => (globalThis.crypto?.randomUUID ? crypto.randomUUID() : "x".repeat(32).replace(/x/g, () => (Math.random() * 16 | 0).toString(16))).replace(/-/g, "");
      const xmlEsc = (s) => String(s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, "")
        .replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" }[c]));

      async function edgeFetch(text, voice, rate) {
        const gec = await edgeGec();
        const id = rid();
        const url = `${EDGE_CFG.ws}?TrustedClientToken=${EDGE_CFG.token}&ConnectionId=${id}&Sec-MS-GEC=${gec}&Sec-MS-GEC-Version=${EDGE_CFG.ver}`;
        const pct = Math.round((rate - 1) * 100);
        const ts = new Date().toUTCString();
        const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='${voice.slice(0, 5)}'><voice name='${voice}'><prosody pitch='+0Hz' rate='${pct >= 0 ? "+" : ""}${pct}%' volume='+0%'>${xmlEsc(text)}</prosody></voice></speak>`;
        return new Promise((res, rej) => {
          const ws = new WebSocket(url);
          ws.binaryType = "arraybuffer";
          cloud.ws = ws;
          const parts = [];
          const timer = setTimeout(() => { try { ws.close(); } catch {} rej(new Error("таймаут")); }, EDGE_CFG.timeout);
          ws.onopen = () => {
            ws.send(`X-Timestamp:${ts}\r\nContent-Type:application/json; charset=utf-8\r\nPath:speech.config\r\n\r\n{"context":{"synthesis":{"audio":{"metadataoptions":{"sentenceBoundaryEnabled":"false","wordBoundaryEnabled":"false"},"outputFormat":"audio-24khz-48kbitrate-mono-mp3"}}}}`);
            ws.send(`X-RequestId:${id}\r\nContent-Type:application/ssml+xml\r\nX-Timestamp:${ts}Z\r\nPath:ssml\r\n\r\n${ssml}`);
          };
          ws.onmessage = (e) => {
            if (typeof e.data === "string") {
              if (e.data.includes("Path:turn.end")) {
                clearTimeout(timer);
                try { ws.close(); } catch {}
                parts.length ? res(new Blob(parts, { type: "audio/mpeg" })) : rej(new Error("пустой ответ"));
              }
              return;
            }
            const hl = new DataView(e.data).getUint16(0);
            const head = new TextDecoder().decode(new Uint8Array(e.data, 2, hl));
            if (head.includes("Path:audio")) parts.push(e.data.slice(2 + hl));
          };
          ws.onerror = () => { clearTimeout(timer); rej(new Error("соединение отклонено")); };
          ws.onclose = () => { clearTimeout(timer); rej(new Error("соединение закрыто")); };
        });
      }

      // Прокси с OpenAI-совместимым API (например, self-hosted openai-edge-tts): POST /v1/audio/speech
      async function proxyFetch(base, text, voice, rate) {
        const ctl = (cloud.ctl = new AbortController());
        const timer = setTimeout(() => ctl.abort(), 15000);
        try {
          const key = (state.settings.ttsProxyKey || "").trim();
          const u = /\/audio\/speech\/?$/.test(base) ? base : base.replace(/\/+$/, "") + "/v1/audio/speech";
          const r = await fetch(u, {
            method: "POST",
            signal: ctl.signal,
            headers: { "Content-Type": "application/json", ...(key ? { Authorization: "Bearer " + key } : {}) },
            body: JSON.stringify({ model: "tts-1", input: text, voice, response_format: "mp3", speed: rate })
          });
          if (!r.ok) throw new Error("HTTP " + r.status);
          return await r.blob();
        } finally { clearTimeout(timer); }
      }

      // Получение аудио с кэшем: повторы фразы не ходят в сеть повторно
      async function cloudGet(text, voice, rate) {
        const key = `${voice}|${rate}|${text}`;
        if (cloud.cache.has(key)) return cloud.cache.get(key);
        const proxy = (state.settings.ttsProxyUrl || "").trim();
        const errs = [];
        let blob = null;
        if (proxy) { try { blob = await proxyFetch(proxy, text, voice, rate); } catch (e) { errs.push("прокси: " + (e.message || e)); } }
        if (!blob && !(cloud.down && Date.now() - cloud.down < EDGE_CFG.downMs)) {
          try { blob = await edgeFetch(text, voice, rate); } catch (e) { errs.push("Edge: " + (e.message || e)); }
        }
        if (!blob) throw new Error(errs.join("; ") || "облако временно отключено");
        const url = URL.createObjectURL(blob);
        cloud.cache.set(key, url);
        if (cloud.cache.size > 24) {
          const k = cloud.cache.keys().next().value;
          try { URL.revokeObjectURL(cloud.cache.get(k)); } catch {}
          cloud.cache.delete(k);
        }
        return url;
      }

      // Какой облачный голос нужен для текста (null → системный голос)
      function cloudVoiceFor(text) {
        const s = state.settings;
        if (s.ttsCloud === false) return null;
        const pref = s.ttsVoiceURI || "auto";
        if (pref !== "auto" && pref !== "dmitry" && !pref.startsWith("edge:")) return null;
        if (cloud.down && Date.now() - cloud.down < EDGE_CFG.downMs && !(s.ttsProxyUrl || "").trim()) return null;
        const lang = detectLang(text);
        let name = pref === "dmitry" ? EDGE_DEFAULT.ru : pref.startsWith("edge:") ? pref.slice(5) : "";
        if (!name || name.slice(0, 2) !== lang) name = EDGE_DEFAULT[lang];
        return { name, lang };
      }

      function cloudAbort() {
        cloud.tok = null;
        try { cloud.ws?.close(); } catch {}
        try { cloud.ctl?.abort(); } catch {}
        cloud.ws = cloud.ctl = null;
        const a = cloud.el;
        if (a) { a.onended = a.onerror = null; try { a.pause(); } catch {} }
      }

      // Единственный <audio>: «разблокируется» жестом пользователя (важно для iOS), затем переиспользуется таймером
      function cloudPrime() {
        try {
          if (!cloud.el) { cloud.el = new Audio(); cloud.el.setAttribute("playsinline", ""); }
          cloud.el.src = ttsSilentWav();
          cloud.el.play().catch(() => {});
        } catch {}
      }

      function cloudSpeak(run, cv, fallback) {
        const tok = (cloud.tok = {});
        const live = () => cloud.tok === tok && ttsRun === run && !run.paused;
        const rate = Math.min(2, Math.max(0.5, Number(state.settings.ttsRate) || 1));
        const bad = (e, soft) => {
          if (!live()) return;
          if (!soft) {
            cloud.down = Date.now();
            toast(`Edge TTS недоступен (${e?.message || e?.name || "ошибка"}) — включён системный голос`);
          }
          fallback();
        };
        cloudGet(run.text, cv.name, rate).then((url) => {
          if (!live()) return;
          const a = cloud.el || (cloud.el = new Audio());
          a.onended = () => { if (live()) { run.speaking = false; ttsAfter(run); } };
          a.onerror = () => bad(new Error("не удалось воспроизвести поток"));
          a.src = url;
          a.play().then(() => {
            if (!live()) return;
            run.startedAt = Date.now();
            if (!cloud.told) { cloud.told = true; toast(`☁ Edge TTS: ${cv.name.replace(/^[a-z]{2}-[A-Z]{2}-|Neural$/g, "")}`); }
            renderBar();
          }).catch((e) => bad(e, e?.name === "NotAllowedError"));
        }).catch((e) => bad(e));
      }

      function unlockAudio() {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) {
            const c = new AC();
            if (c.state === "suspended") c.resume();
          }
          if (navigator.audioSession) navigator.audioSession.type = "playback";
        } catch {}
      }

      function ttsSilentWav() {
        if (ttsKeep.wav) return ttsKeep.wav;
        const rate = 8000;
        const buf = new ArrayBuffer(44 + rate);
        const v = new DataView(buf);
        const w4 = (o, str) => {
          for (let i = 0; i < 4; i++) v.setUint8(o + i, str.charCodeAt(i));
        };
        w4(0, "RIFF");
        v.setUint32(4, 36 + rate, true);
        w4(8, "WAVE");
        w4(12, "fmt ");
        v.setUint32(16, 16, true);
        v.setUint16(20, 1, true);
        v.setUint16(22, 1, true);
        v.setUint32(24, rate, true);
        v.setUint32(28, rate, true);
        v.setUint16(32, 1, true);
        v.setUint16(34, 8, true);
        w4(36, "data");
        v.setUint32(40, rate, true);
        new Uint8Array(buf, 44).fill(128);
        return (ttsKeep.wav = URL.createObjectURL(new Blob([buf], { type: "audio/wav" })));
      }

      function ttsKeepStart(title) {
        ttsKeepStop();
        // На Desktop Edge запуск фонового <audio> одновременно с Web Speech API может перехватывать аудиофокус у Online-голоса Дмитрий.
        // Поэтому бесшумный WAV запускаем только на iOS или когда вкладка свёрнута.
        if (isIOSDevice() || document.hidden) {
          try {
            unlockAudio();
            const a = new Audio(ttsSilentWav());
            a.loop = true;
            a.volume = 0.01;
            a.play().catch(() => {});
            ttsKeep.audio = a;
          } catch {}
        }
        try {
          if ("mediaSession" in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
              title: "Озвучка мысли",
              artist: String(title || "").slice(0, 80)
            });
            navigator.mediaSession.setActionHandler("pause", () => ttsPause());
            navigator.mediaSession.setActionHandler("play", () => ttsResume());
            navigator.mediaSession.setActionHandler("stop", () => ttsStop());
            navigator.mediaSession.setActionHandler("nexttrack", () => stepSlide(1));
            navigator.mediaSession.setActionHandler("previoustrack", () => stepSlide(-1));
          }
        } catch {}
        try {
          const url = URL.createObjectURL(
            new Blob(["setInterval(function(){postMessage(1)},1000)"], { type: "text/javascript" })
          );
          const w = new Worker(url);
          w.onmessage = () => ttsTick();
          ttsKeep.worker = w;
          ttsKeep.url = url;
        } catch {
          const id = setInterval(ttsTick, 1000);
          ttsKeep.worker = { terminate: () => clearInterval(id) };
        }
      }

      function ttsKeepStop() {
        try { ttsKeep.audio?.pause(); } catch {}
        ttsKeep.audio = null;
        try { ttsKeep.worker?.terminate(); } catch {}
        ttsKeep.worker = null;
        if (ttsKeep.url) {
          try { URL.revokeObjectURL(ttsKeep.url); } catch {}
          ttsKeep.url = null;
        }
        try {
          if ("mediaSession" in navigator) {
            navigator.mediaSession.metadata = null;
            navigator.mediaSession.setActionHandler("pause", null);
            navigator.mediaSession.setActionHandler("play", null);
            navigator.mediaSession.setActionHandler("stop", null);
          }
        } catch {}
      }

      function ttsStop() {
        clearTimeout(ttsSpeakTimer);
        ttsRun = null;
        cloudAbort();
        window.__activeUtterance = null;
        ttsKeepStop();
        try {
          if (window.speechSynthesis?.speaking || window.speechSynthesis?.pending) {
            window.speechSynthesis.cancel();
          }
        } catch {}
        render();
      }

      function ttsPause() {
        if (!ttsRun) return;
        clearTimeout(ttsSpeakTimer);
        ttsRun.paused = true;
        ttsRun.speaking = false;
        ttsRun.nextAt = 0;
        cloudAbort();
        window.__activeUtterance = null;
        try {
          if (window.speechSynthesis?.speaking || window.speechSynthesis?.pending) {
            window.speechSynthesis.cancel();
          }
        } catch {}
        render();
      }

      function ttsResume() {
        if (!ttsRun) return;
        ttsRun.paused = false;
        const repeat = state.settings.ttsRepeat;
        ttsRun.max = repeat === "∞" ? Infinity : Number(repeat) || 1;
        if (ttsRun.phase === "done") ttsRun.n = 0;
        if (state.settings.ttsCloud !== false) cloudPrime();
        ttsSay(ttsRun);
        render();
      }

      function ttsAfter(run) {
        if (ttsRun !== run || run.paused) return;
        if (run.n >= run.max) {
          const doc = currentDoc();
          if (state.settings.ttsAutoNext && doc && doc.currentIndex < doc.deconstruct_text.length - 1) {
            doc.currentIndex++;
            ui.slideDir = 1;
            commit();
            const nextTxt = currentSegmentText();
            run.text = stripMarkdownForSpeech(nextTxt);
            run.rawTitle = nextTxt;
            run.n = 0;
            run.phase = "waiting";
            run.nextAt = Date.now() + ttsGapSec() * 1000;
            render();
            return;
          }
          run.phase = "done";
          run.nextAt = 0;
          ttsKeepStop();
          render();
          toast(`Готово: ${run.n} ${run.n === 1 ? "повтор" : run.n < 5 ? "повтора" : "повторов"}`);
        } else {
          run.phase = "waiting";
          run.nextAt = Date.now() + ttsGapSec() * 1000;
          renderBar();
        }
      }

      function ttsSay(run) {
        if (ttsRun !== run || run.paused) return;
        const ss = window.speechSynthesis || null;
        cloudAbort();
        clearTimeout(ttsSpeakTimer);

        const launchSpeak = () => {
          if (ttsRun !== run || run.paused) return;
          run.n++;
          run.speaking = true;
          run.phase = "playing";
          run.startedAt = Date.now();
          run.nextAt = 0;

          const cv = cloudVoiceFor(run.text);
          const sysSpeak = () => {
          if (!ss) { run.speaking = false; ttsAfter(run); return; }
          const u = new SpeechSynthesisUtterance(run.text);
          // Сохраняем глобальную ссылку, чтобы сборщик мусора V8 в Edge не удалил объект во время буферизации голоса Дмитрий
          window.__activeUtterance = u;

          const hasCyr = /[а-яё]/i.test(run.text) || !/[a-z]/i.test(run.text);
          const v = pickSystemVoice(detectLang(run.text)) || pickBestVoice(hasCyr);
          if (v) {
            try {
              u.voice = v;
              u.lang = v.lang || (LANG_BCP[detectLang(run.text)]);
            } catch {
              u.lang = LANG_BCP[detectLang(run.text)];
            }
          } else {
            u.lang = LANG_BCP[detectLang(run.text)];
          }

          u.rate = Math.min(2, Math.max(0.5, Number(state.settings.ttsRate) || 1));
          u.pitch = 1.0;
          u.volume = 1.0;

          u.onstart = () => {
            if (ttsRun !== run) return;
            run.speaking = true;
            run.startedAt = Date.now();
            renderBar();
          };

          u.onend = () => {
            if (window.__activeUtterance === u) window.__activeUtterance = null;
            if (ttsRun !== run || run.paused) return;
            run.speaking = false;
            ttsAfter(run);
          };

          u.onerror = (ev) => {
            if (window.__activeUtterance === u) window.__activeUtterance = null;
            const errType = ev?.error || "";
            if (errType === "canceled" || errType === "interrupted") {
              return;
            }
            if (ttsRun !== run || run.paused) return;
            run.speaking = false;
            ttsAfter(run);
          };

          try {
            if (ss.paused) ss.resume();
          } catch {}

          try {
            ss.speak(u);
          } catch {
            run.speaking = false;
          }
          renderBar();
          };
          if (cv) cloudSpeak(run, cv, sysSpeak); else sysSpeak();
        };

        // Если синтезатор занят предыдущей фразой — останавливаем и запускаем через короткую паузу
        if (ss && (ss.speaking || ss.pending)) {
          try { ss.cancel(); } catch {}
          ttsSpeakTimer = setTimeout(launchSpeak, 65);
          return;
        }

        // Если голос Дмитрий в Edge (или системные голоса на iOS) уже в списке — запускаем синхронно в момент клика
        const currentVoices = getAvailableVoices();
        if (cloudVoiceFor(run.text) || findDmitryVoice(currentVoices) || (isIOSDevice() && currentVoices.length > 0)) {
          launchSpeak();
        } else {
          // Если Edge ещё подгружает облачные голоса Natural — дожидаемся именно появления голоса Дмитрий
          ensureVoicesLoaded(1600).then(() => {
            launchSpeak();
          });
        }
      }

      function ttsTick() {
        const run = ttsRun;
        if (!run || run.paused) return;
        const ss = window.speechSynthesis;
        if (run.speaking) {
          try { if (ss.paused) ss.resume(); } catch {}
          if (Date.now() - run.startedAt > 120000) {
            run.speaking = false;
            try { ss.cancel(); } catch {}
            ttsAfter(run);
          }
          return;
        }
        if (run.nextAt) {
          if (Date.now() >= run.nextAt) {
            ttsSay(run);
          } else {
            renderBar();
          }
        }
      }

      document.addEventListener("visibilitychange", ttsTick);
      globalThis.addEventListener("pageshow", ttsTick);

      function startTtsForText(rawText, customKey = null) {
        if (!("speechSynthesis" in window) && state.settings.ttsCloud === false) {
          toast("Озвучка не поддерживается этим браузером");
          return;
        }
        if (!rawText) return;
        const cleanSpeech = stripMarkdownForSpeech(rawText);
        const doc = currentDoc();
        const segKey = customKey || `${state.activeSource}:${doc?.id}:${doc?.currentIndex}`;

        if (ttsRun && ttsRun.segKey === segKey && (ttsRun.speaking || ttsRun.nextAt)) {
          ttsPause();
          return;
        }

        const repeat = state.settings.ttsRepeat;
        const run = {
          segKey,
          rawTitle: rawText,
          text: cleanSpeech,
          n: 0,
          max: repeat === "∞" ? Infinity : Number(repeat) || 1,
          speaking: false,
          paused: false,
          phase: "playing",
          startedAt: 0,
          nextAt: 0
        };
        ttsRun = run;
        if (state.settings.ttsCloud !== false) cloudPrime();
        ttsKeepStart(cleanSpeech);
        ttsSay(run);
        render();
      }

      function startTtsForCurrentThought() {
        startTtsForText(currentSegmentText());
      }

      // ——— ИКОНКИ ———
      const ICONS = {
        horn: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1zm13.5-2.5a4.5 4.5 0 0 1 0 7m2.8-9.8a8 8 0 0 1 0 12.6"/></svg>',
        copy: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
        check: '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>',
        bookmark: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>',
        play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
        stop: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>',
        up: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>',
        down: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
        minimize: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14h6v6m10-10h-6V4m0 6 7-7M3 21l7-7"/></svg>',
        close: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
        scissors: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.12 15.88M14.47 14.48L20 20M8.12 8.12L12 12"/></svg>'
      };

      // ——— ОТРИСОВКА ГЛАВНОГО ЭКРАНА И ПЛЕЕРА ———
      const stageEl = document.getElementById("stage");
      const barEl = document.getElementById("bar");
      const sheetEl = document.getElementById("sheet");
      const edgeBar = document.getElementById("edge-bar");
      const tsEl = document.getElementById("ts");

      function updateRailIndicators() {
        const totalBmSlides = getAllBookmarkedSegmentsMap().length;
        const badge = document.getElementById("bm-badge");
        if (badge) {
          badge.hidden = totalBmSlides === 0;
          badge.textContent = totalBmSlides > 99 ? "99+" : String(totalBmSlides);
        }
        const bmBtn = document.getElementById("btn-rail-bookmarks");
        const histBtn = document.getElementById("btn-rail-history");
        const isBmMode = state.activeSource === "bookmarks";

        if (bmBtn) bmBtn.classList.toggle("mode-active", isBmMode);
        if (histBtn) histBtn.classList.toggle("mode-active", !isBmMode);
      }

      function render() {
        applyTypographyAndTheme();
        updateRailIndicators();

        const doc = currentDoc();
        if (!doc || !doc.deconstruct_text.length) {
          stageEl.innerHTML = `
            <div class="slide-viewport">
              <div class="thought-card"><p>Добавь текст, чтобы разбить его на отдельные мысли.</p></div>
            </div>
          `;
          edgeBar.style.width = "0%";
          renderBar();
          renderSheet();
          return;
        }

        const total = doc.deconstruct_text.length;
        const idx = Math.min(Math.max(0, doc.currentIndex || 0), total - 1);
        doc.currentIndex = idx;
        const currentThought = doc.deconstruct_text[idx];
        const segKey = `${state.activeSource}:${doc.id}:${idx}`;
        const isSpeaking = !!(ttsRun && ttsRun.segKey === segKey && (ttsRun.speaking || ttsRun.nextAt) && !ttsRun.paused);
        const isBookmarked = isThoughtBookmarked(currentThought);
        const isCopied = ui.justCopiedKey === segKey;
        const animClass = ui.slideDir < 0 ? "enter-prev" : "enter-next";

        stageEl.innerHTML = `
          <div class="slide-viewport" id="touch-zone">
            <div class="thought-card ${animClass}" key="${segKey}">
              ${renderPureMarkdown(currentThought)}
            </div>
            <div class="megaphone-row">
              <button class="horn-btn${isSpeaking ? " speaking" : ""}" data-a="tts-toggle" aria-label="Озвучить мысль" title="Озвучить с повтором">
                ${ICONS.horn}
              </button>
              <button class="horn-btn${isCopied ? " copied" : ""}" data-a="copy-current" aria-label="Скопировать мысль" title="Скопировать мысль (C)">
                ${isCopied ? ICONS.check : ICONS.copy}
              </button>
              <button class="horn-btn${isBookmarked ? " bookmarked" : ""}" data-a="bookmark-toggle" aria-label="${isBookmarked ? "Убрать из закладок" : "В закладки"}" title="${isBookmarked ? "В журнале закладок (нажми, чтобы убрать)" : "Сохранить в журнал закладок (D)"}">
                ${ICONS.bookmark}
              </button>
              ${currentThought.split(/\s+/).length > 4 ? `
                <button class="micro-action-btn" data-a="open-split-current" aria-label="Разделить эту мысль" title="Разделить мысль на две">
                  ${ICONS.scissors}
                </button>
              ` : ""}
            </div>
          </div>
          <div class="nav-controls">
            <button class="nav-arrow" data-a="prev" ${idx <= 0 ? "disabled" : ""} aria-label="Предыдущая мысль">&lt;</button>
            <button class="slide-counter mono" data-a="open-jump" title="Перейти к мысли">${idx + 1} / ${total}</button>
            <button class="nav-arrow" data-a="next" ${idx >= total - 1 ? "disabled" : ""} aria-label="Следующая мысль">&gt;</button>
          </div>
        `;

        const pct = total > 1 ? Math.round(((idx + 1) / total) * 100) : 100;
        edgeBar.style.width = `${pct}%`;

        renderBar();
        renderSheet();
      }

      function renderBar() {
        if (!ttsRun) {
          barEl.hidden = true;
          barEl.innerHTML = "";
          barEl.dataset.sig = "";
          return;
        }

        barEl.hidden = false;
        const collapsed = !!state.settings.playerCollapsed;
        const expanded = !!state.settings.playerExpanded;
        barEl.classList.toggle("collapsed", collapsed);

        const playing = (ttsRun.speaking || ttsRun.nextAt > 0) && !ttsRun.paused;
        const rem = ttsRun.nextAt ? Math.max(0, Math.ceil((ttsRun.nextAt - Date.now()) / 1000)) : 0;
        const statusLabel = ttsRun.speaking
          ? `Озвучивается (${ttsRun.n}${ttsRun.max === Infinity ? "" : "/" + ttsRun.max})`
          : ttsRun.nextAt
            ? `Пауза ${mmss(rem)} (${ttsRun.n}${ttsRun.max === Infinity ? "" : "/" + ttsRun.max})`
            : ttsRun.phase === "done"
              ? "Завершено"
              : "Остановлено";

        const sig = JSON.stringify([
          collapsed,
          expanded,
          playing,
          ttsRun.rawTitle,
          state.settings.ttsVoiceURI,
          state.settings.ttsCloud,
          state.settings.ttsRepeat,
          state.settings.ttsIntervalSec,
          state.settings.ttsRate,
          state.settings.ttsAutoNext,
          getAvailableVoices().length
        ]);

        if (collapsed) {
          barEl.innerHTML = `
            <div class="pl-mini">
              ${playing ? '<span class="mini-dot"></span>' : ""}
              <button class="mono" data-a="pl-collapse-tog" title="Развернуть плеер">${esc(statusLabel)}</button>
              <button data-a="pl-play-tog" aria-label="${playing ? "Пауза" : "Играть"}" style="display:grid;place-items:center;width:22px;height:22px;color:var(--ac)">
                ${playing ? ICONS.stop : ICONS.play}
              </button>
              <button data-a="pl-close" aria-label="Закрыть плеер" style="display:grid;place-items:center;width:20px;height:20px;opacity:0.6">
                ${ICONS.close}
              </button>
            </div>
          `;
          barEl.dataset.sig = sig;
          return;
        }

        if (barEl.dataset.sig === sig) {
          const st = barEl.querySelector("[data-st]");
          if (st) st.textContent = statusLabel;
          return;
        }

        const gap = ttsGapSec();
        const rate = Number(state.settings.ttsRate) || 1;

        barEl.innerHTML = `
          <div class="pl">
            <div class="pl-r">
              <div class="pl-n">
                <b>${esc(ttsRun.rawTitle)}</b>
                <small data-st>${esc(statusLabel)}</small>
              </div>
              <button class="pl-b" data-a="pl-play-tog" aria-label="${playing ? "Остановить" : "Играть"}">
                ${playing ? ICONS.stop : ICONS.play}
              </button>
              <button class="ic-b" data-a="pl-expand-tog" aria-expanded="${expanded}" title="Настройки повтора и паузы">
                ${expanded ? ICONS.down : ICONS.up}
              </button>
              <button class="ic-b" data-a="pl-collapse-tog" title="Свернуть плеер в мини-режим">
                ${ICONS.minimize}
              </button>
              <button class="ic-b" data-a="pl-close" title="Закрыть плеер">
                ${ICONS.close}
              </button>
            </div>
            ${expanded ? `
              <div class="pl-x">
                <label>
                  Повторы (до 25 или ∞)
                  <select data-c="tts-repeat">
                    ${REPEATS.map(r => `<option value="${r}"${r === state.settings.ttsRepeat ? " selected" : ""}>${r}</option>`).join("")}
                  </select>
                </label>
                <label>
                  Пауза между повторами <span class="mono" data-tiv>${fmtSec(gap)}</span>
                  <input type="range" min="10" max="600" step="10" value="${gap}" data-i="tts-iv" data-c="tts-iv">
                </label>
                <label style="grid-column: 1 / -1">
                  <span>Голос озвучки · <b class="mono" style="color:var(--ac)">${esc(getActiveVoiceLabel())}</b></span>
                  <div style="display:flex;gap:6px;align-items:center">
                    <select data-c="tts-voice" style="flex:1">
                      ${buildVoiceOptionsHtml()}
                    </select>
                    <button class="btn gh sm" data-a="refresh-voices" title="Обновить список голосов Edge / iOS">↻</button>
                  </div>
                </label>
                <div class="pl-extra-row">
                  <label class="chk">
                    <input type="checkbox" data-c="tts-autonext"${state.settings.ttsAutoNext ? " checked" : ""}>
                    <span>После повторов переходить к следующей мысли</span>
                  </label>
                  <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mu)">
                    <span>Скорость <b class="mono" data-trate>${rate.toFixed(1)}×</b></span>
                    <input type="range" min="0.5" max="2" step="0.1" value="${rate}" data-i="tts-rate" data-c="tts-rate" style="width:90px">
                  </label>
                </div>
              </div>
            ` : ""}
          </div>
        `;
        barEl.dataset.sig = sig;
      }

      // ——— ОПЕРАЦИИ РАЗДЕЛЕНИЯ И СКЛЕИВАНИЯ МЫСЛЕЙ (ДЛЯ ТЕКСТОВ И ДЛЯ ЖУРНАЛА ЗАКЛАДОК) ———
      function splitCurrentThoughtAtWord(widx) {
        const doc = currentDoc();
        if (!doc || !(widx > 0)) return;
        const cur = doc.deconstruct_text[doc.currentIndex];
        const words = cur.split(/\s+/).filter(Boolean);
        if (widx >= words.length) return;

        const firstPart = words.slice(0, widx).join(" ");
        const secondPart = words.slice(widx).join(" ");

        if (doc.isVirtualStream) {
          const item = doc.flatMap[doc.currentIndex];
          const bm = state.bookmarks_journal.find(x => x.id === item?.bmId);
          if (bm) {
            bm.deconstruct_text.splice(item.chunkIdx, 1, firstPart, secondPart);
            bm.source_text = bm.deconstruct_text.join(" ");
          }
        } else {
          doc.deconstruct_text.splice(doc.currentIndex, 1, firstPart, secondPart);
        }
        commit();
      }

      function mergeCurrentThoughtWithNext() {
        const doc = currentDoc();
        if (!doc || doc.currentIndex >= doc.deconstruct_text.length - 1) return;

        if (doc.isVirtualStream) {
          const curItem = doc.flatMap[doc.currentIndex];
          const nextItem = doc.flatMap[doc.currentIndex + 1];
          const bmCur = state.bookmarks_journal.find(x => x.id === curItem?.bmId);
          if (!bmCur) return;

          if (curItem.bmId === nextItem.bmId) {
            const i = curItem.chunkIdx;
            bmCur.deconstruct_text.splice(i, 2, `${bmCur.deconstruct_text[i]} ${bmCur.deconstruct_text[i + 1]}`);
            bmCur.source_text = bmCur.deconstruct_text.join(" ");
          } else {
            const bmNextIdx = state.bookmarks_journal.findIndex(x => x.id === nextItem?.bmId);
            if (bmNextIdx !== -1) {
              const bmNext = state.bookmarks_journal[bmNextIdx];
              const nextText = bmNext.deconstruct_text[nextItem.chunkIdx];
              bmCur.deconstruct_text[curItem.chunkIdx] = `${bmCur.deconstruct_text[curItem.chunkIdx]} ${nextText}`;
              bmCur.source_text = bmCur.deconstruct_text.join(" ");
              bmNext.deconstruct_text.splice(nextItem.chunkIdx, 1);
              if (bmNext.deconstruct_text.length === 0) {
                state.bookmarks_journal.splice(bmNextIdx, 1);
              } else {
                bmNext.source_text = bmNext.deconstruct_text.join(" ");
              }
            }
          }
        } else {
          const i = doc.currentIndex;
          doc.deconstruct_text.splice(i, 2, `${doc.deconstruct_text[i]} ${doc.deconstruct_text[i + 1]}`);
        }
        commit();
      }

      // ——— НАВИГАЦИЯ ПО МЫСЛЯМ ———
      function stepSlide(delta) {
        const doc = currentDoc();
        if (!doc || !doc.deconstruct_text.length) return;
        const nextIdx = doc.currentIndex + delta;
        if (nextIdx < 0 || nextIdx >= doc.deconstruct_text.length) return;
        doc.currentIndex = nextIdx;
        ui.slideDir = delta;
        commit();

        if (ttsRun && !ttsRun.paused && (ttsRun.speaking || ttsRun.nextAt)) {
          startTtsForCurrentThought();
        } else {
          render();
        }
      }

      // ——— МОДАЛЬНЫЕ ОКНА (ВВОД, ИСТОРИЯ, ЖУРНАЛ ЗАКЛАДОК, НАСТРОЙКИ, РАЗДЕЛЕНИЕ) ———
      function openSheet(name) {
        ui.sheet = name;
        document.body.classList.add("lock");
        renderSheet();
      }

      function closeSheet() {
        ui.sheet = null;
        document.body.classList.remove("lock");
        sheetEl.hidden = true;
        sheetEl.innerHTML = "";
      }

      function renderSheet() {
        if (!ui.sheet) {
          sheetEl.hidden = true;
          sheetEl.innerHTML = "";
          return;
        }
        sheetEl.hidden = false;

        if (ui.sheet === "input") {
          const mode = state.settings.splitMode;
          sheetEl.innerHTML = `
            <div class="sh" role="dialog" aria-modal="true">
              <div class="shh">
                <span>Новый текст для деконструкции</span>
                <button class="ic-b" data-a="close-sheet" aria-label="Закрыть">${ICONS.close}</button>
              </div>
              <p class="cap">Текст сохраняется строго слово в слово. Номера пунктов (1., 2.) и слова до «—» не разрываются между слайдами.</p>
              <textarea id="source-input" rows="8" placeholder="Вставь или напиши текст...">${esc(ui.draftText)}</textarea>
              <div class="sec">
                <p class="cap">Режим разбиения на мысли</p>
                <div class="seg-pills">
                  <button class="pill${mode === "sentences" ? " on" : ""}" data-a="set-mode" data-m="sentences">По предложениям</button>
                  <button class="pill${mode === "clauses" ? " on" : ""}" data-a="set-mode" data-m="clauses">Дробно (по микро-смыслам)</button>
                  <button class="pill${mode === "ai" ? " on" : ""}" data-a="set-mode" data-m="ai">Умное разбиение ИИ (слово в слово)</button>
                </div>
              </div>
              <div class="btn-row">
                <button class="btn" data-a="run-deconstruct" ${ui.aiBusy ? "disabled" : ""}>
                  ${ui.aiBusy ? "Разбиваю на мысли…" : "Разбить и открыть слайд-шоу"}
                </button>
              </div>
            </div>
          `;
          return;
        }

        if (ui.sheet === "history") {
          const items = state.log_input_history;
          const listHtml = items.map(item => {
            const isAct = state.activeSource === "history" && item.id === state.activeId;
            const isExp = ui.expandedHistId === item.id;
            const preview = item.deconstruct_text[0] || item.source_text.slice(0, 120);
            const dateStr = new Date(item.createdAt).toLocaleString("ru-RU", {
              day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit"
            });

            const chunksHtml = isExp ? `
              <ul class="chunks-list">
                ${item.deconstruct_text.map((seg, idx) => `
                  <li class="chunk-item">
                    <span class="chunk-text" data-a="hist-jump" data-id="${item.id}" data-idx="${idx}">
                      ${esc(seg)}
                    </span>
                    <div class="chunk-btns">
                      <button class="btn sm gh" data-a="chunk-copy" data-id="${item.id}" data-idx="${idx}" title="Скопировать кусочек">Копир.</button>
                      <button class="btn sm gh" data-a="chunk-bookmark" data-id="${item.id}" data-idx="${idx}" title="Сохранить в закладки">★</button>
                      ${idx < item.deconstruct_text.length - 1 ? `
                        <button class="btn sm gh" data-a="chunk-merge" data-id="${item.id}" data-idx="${idx}" title="Склеить со следующей мыслью">+</button>
                      ` : ""}
                    </div>
                  </li>
                `).join("")}
              </ul>
            ` : "";

            return `
              <li class="hist-card${isAct ? " active" : ""}">
                <div class="hist-top">
                  <button class="hist-preview" data-a="hist-select" data-id="${item.id}">
                    ${esc(preview.length > 140 ? preview.slice(0, 140) + "…" : preview)}
                  </button>
                </div>
                <div class="hist-meta">
                  <span>${dateStr} · шаг ${(item.currentIndex || 0) + 1} из ${item.deconstruct_text.length}</span>
                  <div class="hist-actions">
                    <button class="btn sm gh" data-a="hist-toggle-chunks" data-id="${item.id}">
                      ${isExp ? "Скрыть кусочки" : `Кусочки (${item.deconstruct_text.length})`}
                    </button>
                    <button class="btn sm" data-a="hist-select" data-id="${item.id}">Открыть</button>
                    ${items.length > 1 ? `
                      <button class="btn sm gh wn" data-a="hist-delete" data-id="${item.id}" aria-label="Удалить">✕</button>
                    ` : ""}
                  </div>
                </div>
                ${chunksHtml}
              </li>
            `;
          }).join("");

          sheetEl.innerHTML = `
            <div class="sh" role="dialog" aria-modal="true">
              <div class="shh">
                <span>Сохранённые тексты (${items.length})</span>
                <button class="ic-b" data-a="close-sheet" aria-label="Закрыть">${ICONS.close}</button>
              </div>
              <p class="cap">Нажми на любой текст, чтобы продолжить с того же места, или раскрой его кусочки.</p>
              <ul class="hist-list">${listHtml}</ul>
              <div class="btn-row" style="margin-top: 18px">
                <button class="btn gh sm" data-a="open-input">+ Добавить новый текст</button>
                <button class="btn gh sm" data-a="open-bookmarks">Журнал закладок</button>
                <button class="btn gh sm" data-a="export-json">Экспорт JSON</button>
                <button class="btn gh sm" data-a="import-json-trigger">Импорт JSON</button>
              </div>
            </div>
          `;
          return;
        }

        if (ui.sheet === "bookmarks") {
          const bms = state.bookmarks_journal;
          const flatAll = getAllBookmarkedSegmentsMap();
          const isStreamActive = state.activeSource === "bookmarks" && state.activeBookmarkId === "__ALL__";

          const streamBannerHtml = flatAll.length > 0 ? `
            <div class="bm-stream-banner">
              <div class="bm-stream-info">
                <b>Единый поток всех закладок (${flatAll.length})</b>
                <span>Листай все сохранённые мысли на слайдах, озвучивай с повтором, разделяй и склеивай</span>
              </div>
              <button class="btn sm" data-a="bm-open-stream">
                ${isStreamActive ? "Открыто на слайдах" : "Открыть как слайд-шоу"}
              </button>
            </div>
          ` : "";

          const bmListHtml = bms.length === 0
            ? `<p class="cap" style="padding: 16px 0;">В журнале закладок пока пусто. Нажми на значок закладки под любой мыслью на слайде или добавь текст ниже.</p>`
            : `<ul class="hist-list">${bms.map(bm => {
                const isAct = state.activeSource === "bookmarks" && state.activeBookmarkId === bm.id;
                const isExp = ui.expandedBmId === bm.id;
                const preview = bm.deconstruct_text[0] || bm.source_text.slice(0, 140);

                const chunksHtml = isExp ? `

          const addBmBoxHtml = ui.bmInputOpen ? `
            <div class="sec" style="border-top: 1px solid var(--ln); padding-top: 14px;">

                <button class="btn sm" data-a="run-bm-deconstruct" ${ui.aiBusy ? "disabled" : ""}>

                </button>

          sheetEl.innerHTML = `
            <div class="sh" role="dialog" aria-modal="true">
              <div class="shh">
                <span>Журнал закладок (${bms.length})</span>

        if (ui.sheet === "settings") {

              <div class="sec">

                  <div style="display:flex;gap:8px;margin-top:6px">
                    <select data-c="tts-voice" style="flex:1">
                      ${buildVoiceOptionsHtml()}

                <label class="chk" style="margin-bottom:10px">
                  <input type="checkbox" data-c="tts-cloud"${state.settings.ttsCloud !== false ? " checked" : ""}>
                  <span>☁ Облачный Edge TTS: потоковый звук с серверов Microsoft (текст уходит в интернет)</span>

                <label class="cap" style="display:block;margin-bottom:10px">

                  <input type="text" data-c="tts-proxy" autocomplete="off" placeholder="https://…" value="${esc(state.settings.ttsProxyUrl || "")}" style="margin-top:6px">
                  <input type="password" data-c="tts-proxykey" autocomplete="off" placeholder="Ключ прокси (если нужен)" value="${esc(state.settings.ttsProxyKey || "")}" style="margin-top:6px">

                <p class="cap" style="line-height:1.5;opacity:.75;margin-bottom:10px">iOS: Настройки → Универсальный доступ → Устный контент → Голоса → Русский → скачайте Milena / Yuri (Улучшенный или Premium), затем нажмите «Тест / ↻» — все установленные варианты появятся в списке.</p>
                <div class="grid-2">

              <div class="sec">

                <div class="btn-row">
                  <button class="btn gh sm" data-a="export-json">Скачать JSON</button>
                  <button class="btn gh sm" data-a="copy-json">Скопировать JSON</button>
                  <button class="btn gh sm" data-a="import-json-trigger">Загрузить JSON из файла</button>
                </div>
              </div>

          return;

        if (ui.sheet === "split-current") {
          const doc = currentDoc();
          const currentThought = currentSegmentText();
          const words = currentThought.split(/\s+/).filter(Boolean);
          sheetEl.innerHTML = `
            <div class="sh" role="dialog" aria-modal="true">
              <div class="shh">
                <span>Разделить мысль на две (слово в слово)</span>
                <button class="ic-b" data-a="close-sheet" aria-label="Закрыть">${ICONS.close}</button>
              </div>
              <p class="cap">Нажми на слово, с которого должна начинаться вторая мысль:</p>
              <div class="seg-pills" style="margin-top: 12px">
                ${words.map((w, i) => i === 0 ? `<span class="pill" style="opacity:0.45;cursor:default">${esc(w)}</span>` : `
                  <button class="pill" data-a="split-at-word" data-widx="${i}">${esc(w)}</button>
                `).join("")}
              </div>
              ${doc && doc.deconstruct_text.length > 1 && doc.currentIndex < doc.deconstruct_text.length - 1 ? `
                <div class="btn-row" style="margin-top: 18px">
                  <button class="btn gh sm" data-a="merge-with-next">Склеить текущую мысль со следующей</button>

            </div>
          `;
          return;
        }

        if (ui.sheet === "jump") {
          const doc = currentDoc();
          if (!doc) return;
          sheetEl.innerHTML = `
            <div class="sh" role="dialog" aria-modal="true">
              <div class="shh">
                <span>Переход к мысли (${doc.currentIndex + 1} / ${doc.deconstruct_text.length})</span>
                <button class="ic-b" data-a="close-sheet" aria-label="Закрыть">${ICONS.close}</button>
              </div>
              <input type="range" min="0" max="${doc.deconstruct_text.length - 1}" step="1" value="${doc.currentIndex}" data-i="jump-slider">
              <ul class="chunks-list" style="margin-top: 14px">
                ${doc.deconstruct_text.map((seg, idx) => `
                  <li class="chunk-item" style="${idx === doc.currentIndex ? "border:1px solid var(--ac)" : ""}">
                    <span class="chunk-text" data-a="active-doc-jump" data-idx="${idx}">
                      ${esc(seg)}
                    </span>
                    <div class="chunk-btns">
                      <button class="btn sm gh" data-a="jump-copy-item" data-idx="${idx}" title="Скопировать">Копир.</button>

            </div>
          `;
        }
      }

      // ——— ЭКСПОРТ И ИМПОРТ JSON ———
      function getExportPayload() {
        return JSON.stringify({
          app: "meaning-visualizer",
          v: 2,
          exportedAt: new Date().toISOString(),
          activeSource: state.activeSource,
          activeId: state.activeId,
          activeBookmarkId: state.activeBookmarkId,
          log_input_history: state.log_input_history,
          bookmarks_journal: state.bookmarks_journal,
          settings: {
            theme: state.settings.theme,
            aiModel: state.settings.aiModel,
            splitMode: state.settings.splitMode,
            fontId: state.settings.fontId,
            fontSize: state.settings.fontSize,
            lineHeight: state.settings.lineHeight,
            maxWidth: state.settings.maxWidth,
            ttsVoiceURI: state.settings.ttsVoiceURI,
            ttsCloud: state.settings.ttsCloud,
            ttsRate: state.settings.ttsRate,
            ttsIntervalSec: state.settings.ttsIntervalSec,
            ttsRepeat: state.settings.ttsRepeat,
            ttsAutoNext: state.settings.ttsAutoNext
          }
        }, null, 2);
      }

      function downloadJson() {
        const data = getExportPayload();
        const blob = new Blob([data], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `smysly-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 3000);
        toast("JSON сохранён");
      }

      function importJsonText(rawText) {
        try {
          const d = JSON.parse(String(rawText).trim());
          let importedHistory = [];
          let importedBookmarks = [];

          if (Array.isArray(d.log_input_history)) {
            importedHistory = d.log_input_history.filter(x => x && Array.isArray(x.deconstruct_text) && x.deconstruct_text.length);
          } else if (Array.isArray(d.deconstruct_text) && d.deconstruct_text.length) {
            importedHistory = [{
              id: uid(),
              createdAt: Date.now(),
              source_text: d.source_text || d.deconstruct_text.join(" "),
              deconstruct_text: d.deconstruct_text.map(String),
              currentIndex: 0,
              mode: "sentences"
            }];
          }

          if (Array.isArray(d.bookmarks_journal)) {
            importedBookmarks = d.bookmarks_journal.filter(x => x && Array.isArray(x.deconstruct_text) && x.deconstruct_text.length);
          }

          if (!importedHistory.length && !importedBookmarks.length) {
            toast("В JSON не найдено текстов или закладок");
            return;
          }

          const existingIds = new Set(state.log_input_history.map(x => x.id));
          for (const item of importedHistory) {
            if (!item.id || existingIds.has(item.id)) item.id = uid();
            item.currentIndex = Math.min(Math.max(0, Number(item.currentIndex) || 0), item.deconstruct_text.length - 1);
            state.log_input_history.unshift(item);
          }

          const existingBmIds = new Set(state.bookmarks_journal.map(x => x.id));
          for (const bm of importedBookmarks) {
            if (!bm.id || existingBmIds.has(bm.id)) bm.id = uid();
            bm.currentIndex = Math.min(Math.max(0, Number(bm.currentIndex) || 0), bm.deconstruct_text.length - 1);
            state.bookmarks_journal.unshift(bm);
          }

          if (importedHistory.length) {
            state.activeId = importedHistory[0].id;
            state.activeSource = "history";
          } else if (importedBookmarks.length) {
            state.activeSource = "bookmarks";
          }

          if (d.settings && typeof d.settings === "object") {
            const keepKey = state.settings.apiKey;
            Object.assign(state.settings, d.settings, { apiKey: d.settings.apiKey || keepKey });
          }

          commit();
          closeSheet();
          render();
          toast(`Импортировано: текстов — ${importedHistory.length}, закладок — ${importedBookmarks.length}`);
        } catch {
          toast("Ошибка чтения JSON-файла");
        }
      }

      // ——— УВЕДОМЛЕНИЯ ———
      let toastTimer = 0;
      function toast(msg) {
        tsEl.textContent = msg;
        tsEl.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          tsEl.hidden = true;
        }, 2500);
      }

      // ——— ОБРАБОТЧИКИ СОБЫТИЙ ———
      document.addEventListener("click", async (e) => {
        const el = e.target.closest?.("[data-a]");
        if (!el) return;
        const act = el.dataset.a;

        if (act === "prev") stepSlide(-1);
        else if (act === "next") stepSlide(1);
        else if (act === "tts-toggle") startTtsForCurrentThought();
        else if (act === "copy-current") {
          const doc = currentDoc();
          const segKey = `${state.activeSource}:${doc?.id}:${doc?.currentIndex}`;
          copyTextToClipboard(currentSegmentText(), segKey);
        }
        else if (act === "bookmark-toggle") {
          toggleBookmarkForThought(currentSegmentText());
        }
        else if (act === "toggle-theme") {
          state.settings.theme = state.settings.theme === "light" ? "dark" : "light";
          commit();
          render();
          toast(state.settings.theme === "light" ? "Светлая тема (Тёплое молоко)" : "Тёмная тема");
        }
        else if (act === "set-theme") {
          state.settings.theme = el.dataset.theme === "light" ? "light" : "dark";
          commit();
          render();
        }
        else if (act === "open-input") {
          ui.draftText = "";
          openSheet("input");
          setTimeout(() => document.getElementById("source-input")?.focus(), 40);
        }
        else if (act === "open-history") openSheet("history");
        else if (act === "open-bookmarks") openSheet("bookmarks");
        else if (act === "open-settings") openSheet("settings");
        else if (act === "open-jump") openSheet("jump");
        else if (act === "open-split-current") openSheet("split-current");
        else if (act === "close-sheet") closeSheet();
        else if (act === "close-bg" && e.target === sheetEl) closeSheet();
        else if (act === "switch-to-history") {
          state.activeSource = "history";
          commit();
          closeSheet();
          render();
        }
        else if (act === "set-mode") {
          ui.draftText = document.getElementById("source-input")?.value ?? ui.draftText;
          state.settings.splitMode = el.dataset.m;
          commit();
          renderSheet();
        }
        else if (act === "run-deconstruct") {
          const inp = document.getElementById("source-input");
          const raw = (inp?.value ?? ui.draftText).trim();
          if (!raw) {
            toast("Введи или вставь текст");
            return;
          }
          ui.draftText = raw;
          ui.aiBusy = true;
          renderSheet();
          const segments = await deconstruct_text(raw, state.settings.splitMode);
          ui.aiBusy = false;
          if (!segments.length) {
            toast("Не удалось выделить мысли");
            renderSheet();
            return;
          }
          const newEntry = {
            id: uid(),
            createdAt: Date.now(),
            source_text: raw,
            deconstruct_text: segments,
            currentIndex: 0,
            mode: state.settings.splitMode
          };
          state.log_input_history.unshift(newEntry);
          state.activeId = newEntry.id;
          state.activeSource = "history";
          ui.draftText = "";
          commit();
          closeSheet();
          render();
        }
        else if (act === "toggle-bm-input") {
          ui.bmInputOpen = !ui.bmInputOpen;
          renderSheet();
          if (ui.bmInputOpen) {
            setTimeout(() => document.getElementById("bm-source-input")?.focus(), 40);
          }
        }
        else if (act === "run-bm-deconstruct") {
          const inp = document.getElementById("bm-source-input");
          const raw = (inp?.value ?? ui.bmDraftText).trim();
          if (!raw) {
            toast("Введи или вставь текст для закладки");
            return;
          }
          ui.bmDraftText = raw;
          ui.aiBusy = true;
          renderSheet();
          const segments = await deconstruct_text(raw, state.settings.splitMode);
          ui.aiBusy = false;
          if (!segments.length) {
            toast("Не удалось выделить мысли");
            renderSheet();
            return;
          }
          const newBm = {
            id: uid(),
            createdAt: Date.now(),
            source_text: raw,
            deconstruct_text: segments,
            currentIndex: 0,
            mode: state.settings.splitMode
          };
          state.bookmarks_journal.unshift(newBm);
          ui.bmDraftText = "";
          ui.bmInputOpen = false;
          commit();
          render();
          toast("Добавлено в журнал закладок");
        }
        else if (act === "bm-open-stream") {
          state.activeSource = "bookmarks";
          state.activeBookmarkId = "__ALL__";
          state.bookmarksStreamIndex = 0;
          commit();
          closeSheet();
          render();
        }
        else if (act === "bm-select") {
          const id = el.dataset.id;
          const bm = state.bookmarks_journal.find(x => x.id === id);
          if (!bm) return;
          state.activeSource = "bookmarks";
          // Если у закладки несколько кусочков, открываем её как документ; если 1 мысль — открываем поток всех закладок на этой мысли, чтобы работали < и > по всем закладкам!
          if (bm.deconstruct_text.length > 1) {
            state.activeBookmarkId = bm.id;
          } else {
            state.activeBookmarkId = "__ALL__";
            const flat = getAllBookmarkedSegmentsMap();
            const pos = flat.findIndex(x => x.bmId === bm.id);
            state.bookmarksStreamIndex = pos !== -1 ? pos : 0;
          }
          commit();
          closeSheet();
          render();
        }
        else if (act === "bm-toggle-chunks") {
          const id = el.dataset.id;
          ui.expandedBmId = ui.expandedBmId === id ? null : id;
          renderSheet();
        }
        else if (act === "bm-jump") {
          const id = el.dataset.id;
          const idx = Number(el.dataset.idx) || 0;
          const bm = state.bookmarks_journal.find(x => x.id === id);
          if (bm) {
            state.activeSource = "bookmarks";
            if (bm.deconstruct_text.length > 1) {
              state.activeBookmarkId = bm.id;
              bm.currentIndex = idx;
            } else {
              state.activeBookmarkId = "__ALL__";
              const flat = getAllBookmarkedSegmentsMap();
              const pos = flat.findIndex(x => x.bmId === bm.id && x.chunkIdx === idx);
              state.bookmarksStreamIndex = pos !== -1 ? pos : 0;
            }
            commit();
            closeSheet();
            render();
          }
        }
        else if (act === "bm-copy-entry") {
          const bm = state.bookmarks_journal.find(x => x.id === el.dataset.id);
          if (bm) copyTextToClipboard(bm.deconstruct_text.join("\n\n"));
        }
        else if (act === "bm-speak-entry") {
          const bm = state.bookmarks_journal.find(x => x.id === el.dataset.id);
          if (bm) {
            const txt = bm.deconstruct_text[bm.currentIndex || 0] || bm.deconstruct_text[0];
            startTtsForText(txt, `bm:${bm.id}:${bm.currentIndex || 0}`);
          }
        }
        else if (act === "bm-chunk-copy") {
          const bm = state.bookmarks_journal.find(x => x.id === el.dataset.id);
          const idx = Number(el.dataset.idx) || 0;
          if (bm && bm.deconstruct_text[idx]) {
            copyTextToClipboard(bm.deconstruct_text[idx]);
          }
        }
        else if (act === "bm-chunk-speak") {
          const bm = state.bookmarks_journal.find(x => x.id === el.dataset.id);
          const idx = Number(el.dataset.idx) || 0;
          if (bm && bm.deconstruct_text[idx]) {
            startTtsForText(bm.deconstruct_text[idx], `bm:${bm.id}:${idx}`);
          }
        }
        else if (act === "bm-chunk-merge") {
          const bm = state.bookmarks_journal.find(x => x.id === el.dataset.id);
          const idx = Number(el.dataset.idx);
          if (bm && idx >= 0 && idx < bm.deconstruct_text.length - 1) {
            bm.deconstruct_text.splice(idx, 2, `${bm.deconstruct_text[idx]} ${bm.deconstruct_text[idx + 1]}`);
            bm.source_text = bm.deconstruct_text.join(" ");
            if (bm.currentIndex >= bm.deconstruct_text.length) {
              bm.currentIndex = bm.deconstruct_text.length - 1;
            }
            commit();
            render();
          }
        }
        else if (act === "bm-delete") {
          const id = el.dataset.id;
          state.bookmarks_journal = state.bookmarks_journal.filter(x => x.id !== id);
          if (state.activeBookmarkId === id) {
            state.activeBookmarkId = "__ALL__";
          }
          if (state.bookmarks_journal.length === 0 && state.activeSource === "bookmarks") {
            state.activeSource = "history";
          }
          commit();
          render();
          toast("Закладка удалена");
        }
        else if (act === "hist-select") {
          state.activeSource = "history";
          state.activeId = el.dataset.id;
          commit();
          closeSheet();
          render();
        }
        else if (act === "hist-toggle-chunks") {
          const id = el.dataset.id;
          ui.expandedHistId = ui.expandedHistId === id ? null : id;
          renderSheet();
        }
        else if (act === "hist-jump") {
          const id = el.dataset.id;
          const idx = Number(el.dataset.idx) || 0;
          const doc = state.log_input_history.find(x => x.id === id);
          if (doc) {
            state.activeSource = "history";
            state.activeId = doc.id;
            doc.currentIndex = idx;
            commit();
            closeSheet();
            render();
          }
        }
        else if (act === "active-doc-jump") {
          const idx = Number(el.dataset.idx) || 0;
          const doc = currentDoc();
          if (doc) {
            doc.currentIndex = idx;
            commit();
            closeSheet();
            render();
          }
        }
        else if (act === "jump-copy-item") {
          const idx = Number(el.dataset.idx) || 0;
          const doc = currentDoc();
          if (doc && doc.deconstruct_text[idx]) {
            copyTextToClipboard(doc.deconstruct_text[idx]);
          }
        }
        else if (act === "chunk-copy") {
          const doc = state.log_input_history.find(x => x.id === el.dataset.id);
          const idx = Number(el.dataset.idx) || 0;
          if (doc && doc.deconstruct_text[idx]) {
            copyTextToClipboard(doc.deconstruct_text[idx]);
          }
        }
        else if (act === "chunk-bookmark") {
          const doc = state.log_input_history.find(x => x.id === el.dataset.id);
          const idx = Number(el.dataset.idx) || 0;
          if (doc && doc.deconstruct_text[idx]) {
            toggleBookmarkForThought(doc.deconstruct_text[idx]);
          }
        }
        else if (act === "hist-delete") {
          const id = el.dataset.id;
          if (state.log_input_history.length <= 1) return;
          state.log_input_history = state.log_input_history.filter(x => x.id !== id);
          if (state.activeId === id) state.activeId = state.log_input_history[0].id;
          commit();
          render();
        }
        else if (act === "chunk-merge") {
          const doc = state.log_input_history.find(x => x.id === el.dataset.id);
          const idx = Number(el.dataset.idx);
          if (doc && idx >= 0 && idx < doc.deconstruct_text.length - 1) {
            doc.deconstruct_text.splice(idx, 2, `${doc.deconstruct_text[idx]} ${doc.deconstruct_text[idx + 1]}`);
            if (doc.currentIndex >= doc.deconstruct_text.length) {
              doc.currentIndex = doc.deconstruct_text.length - 1;
            }
            commit();
            render();
          }
        }
        else if (act === "split-at-word") {
          const widx = Number(el.dataset.widx);
          if (widx > 0) {
            splitCurrentThoughtAtWord(widx);
            closeSheet();
            render();
          }
        }
        else if (act === "merge-with-next") {
          mergeCurrentThoughtWithNext();
          closeSheet();
          render();
        }
        else if (act === "save-api-settings") {
          const key = document.getElementById("cfg-apikey")?.value.trim() || "";
          const model = document.getElementById("cfg-model-custom")?.value.trim() || "gemini-2.5-flash";
          state.settings.apiKey = key;
          state.settings.aiModel = model;
          commit();
          toast("API-ключ и модель сохранены");
        }
        else if (act === "refresh-voices") {
          await ensureVoicesLoaded(1600);
          refreshVoices();
          barEl.dataset.sig = "";
          renderBar();
          if (ui.sheet === "settings") renderSheet();
          cloud.down = 0;
          cloud.told = false;
          toast("Активен голос: " + getActiveVoiceLabel());
          startTtsForCurrentThought();
        }
        else if (act === "export-json") downloadJson();
        else if (act === "copy-json") {
          try {
            await navigator.clipboard.writeText(getExportPayload());
            toast("JSON скопирован в буфер обмена");
          } catch {
            toast("Не удалось скопировать");
          }
        }
        else if (act === "import-json-trigger") {
          document.getElementById("json-file")?.click();
        }
        else if (act === "pl-play-tog") {
          if (!ttsRun) return;
          const playing = (ttsRun.speaking || ttsRun.nextAt > 0) && !ttsRun.paused;
          if (playing) ttsPause();
          else ttsResume();
        }
        else if (act === "pl-expand-tog") {
          state.settings.playerExpanded = !state.settings.playerExpanded;
          commit();
          renderBar();
        }
        else if (act === "pl-collapse-tog") {
          state.settings.playerCollapsed = !state.settings.playerCollapsed;
          commit();
          renderBar();
        }
        else if (act === "pl-close") {
          ttsStop();
        }
      });

      document.addEventListener("input", (e) => {
        const el = e.target;
        const k = el.dataset?.i;
        if (el.id === "source-input") {
          ui.draftText = el.value;
          return;
        }
        if (el.id === "bm-source-input") {
          ui.bmDraftText = el.value;
          return;
        }
        if (k === "font-size") {
          state.settings.fontSize = Number(el.value);
          const lbl = document.getElementById("lbl-fs");
          if (lbl) lbl.textContent = `${el.value}px`;
          applyTypographyAndTheme();
        } else if (k === "line-height") {
          state.settings.lineHeight = Number(el.value);
          const lbl = document.getElementById("lbl-lh");
          if (lbl) lbl.textContent = el.value;
          applyTypographyAndTheme();
        } else if (k === "tts-iv") {
          document.querySelectorAll("[data-tiv]").forEach(n => {
            n.textContent = fmtSec(el.value);
          });
        } else if (k === "tts-rate") {
          const out = document.querySelector("[data-trate]");
          if (out) out.textContent = `${Number(el.value).toFixed(1)}×`;
        } else if (k === "jump-slider") {
          const doc = currentDoc();
          if (doc) {
            doc.currentIndex = Number(el.value) || 0;
            commit();
            render();
          }
        }
      });

      document.addEventListener("change", (e) => {
        const el = e.target;
        const c = el.dataset?.c;
        if (c === "font-family") {
          state.settings.fontId = el.value;
          commit();
          render();
        } else if (c === "font-size" || c === "line-height") {
          commit();
        } else if (c === "model-select") {
          if (el.value !== "__custom__") {
            const customInp = document.getElementById("cfg-model-custom");
            if (customInp) customInp.value = el.value;
            state.settings.aiModel = el.value;
            commit();
          }
        } else if (c === "tts-voice") {
          state.settings.ttsVoiceURI = el.value;
          commit();
          barEl.dataset.sig = "";
          renderBar();
          if (ui.sheet === "settings") renderSheet();
          if (ttsRun && !ttsRun.paused) {
            ttsSay(ttsRun);
          }
        } else if (c === "tts-repeat") {
          state.settings.ttsRepeat = el.value;
          if (ttsRun) {
            ttsRun.max = el.value === "∞" ? Infinity : Number(el.value) || 1;
          }
          commit();
          renderBar();
        } else if (c === "tts-iv") {
          state.settings.ttsIntervalSec = Math.min(TTS_GAP_MAX, Math.max(TTS_GAP_MIN, Number(el.value) || TTS_GAP_MIN));
          commit();
          renderBar();
        } else if (c === "tts-rate") {
          state.settings.ttsRate = Math.min(2, Math.max(0.5, Number(el.value) || 1));
          commit();
          renderBar();
        } else if (c === "tts-cloud") {
          state.settings.ttsCloud = !!el.checked;
          cloud.down = 0;
          commit();
          barEl.dataset.sig = "";
          renderBar();
          if (ui.sheet === "settings") renderSheet();
        } else if (c === "tts-proxy") {
          state.settings.ttsProxyUrl = el.value.trim();
          cloud.down = 0;
          commit();
        } else if (c === "tts-proxykey") {
          state.settings.ttsProxyKey = el.value.trim();
          commit();
        } else if (c === "tts-autonext") {
          state.settings.ttsAutoNext = !!el.checked;
          commit();
        }
      });

      document.getElementById("json-file")?.addEventListener("change", async (e) => {
        const file = e.target.files?.[0];
        e.target.value = "";
        if (!file) return;
        try {
          const txt = await file.text();
          importJsonText(txt);
        } catch {
          toast("Не удалось прочитать файл");
        }
      });

      // Клавиатурная навигация
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && ui.sheet) {
          closeSheet();
          return;
        }
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        if (ui.sheet || ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) return;

        const key = e.key.toLowerCase();
        if (e.key === "ArrowRight" || e.key === " ") {
          e.preventDefault();
          stepSlide(1);
        } else if (e.key === "ArrowLeft") {
          e.preventDefault();
          stepSlide(-1);
        } else if (key === "n" || key === "т") {
          e.preventDefault();
          openSheet("input");
        } else if (key === "h" || key === "р") {
          e.preventDefault();
          openSheet("history");
        } else if (key === "b" || key === "и") {
          e.preventDefault();
          openSheet("bookmarks");
        } else if (key === "s" || key === "ы") {
          e.preventDefault();
          openSheet("settings");
        } else if (key === "t" || key === "е") {
          e.preventDefault();
          state.settings.theme = state.settings.theme === "light" ? "dark" : "light";
          commit();
          render();
        } else if (key === "d" || key === "в") {
          e.preventDefault();
          toggleBookmarkForThought(currentSegmentText());
        } else if ((key === "c" || key === "с") && !window.getSelection()?.toString()) {
          e.preventDefault();
          const doc = currentDoc();
          const segKey = `${state.activeSource}:${doc?.id}:${doc?.currentIndex}`;
          copyTextToClipboard(currentSegmentText(), segKey);
        }
      });

      // Свайпы влево/вправо на тач-экранах
      let touchStartX = null;
      let touchStartY = null;
      document.addEventListener("touchstart", (e) => {
        if (ui.sheet || e.target.closest("#bar")) {
          touchStartX = null;
          return;
        }
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }, { passive: true });

      document.addEventListener("touchend", (e) => {
        if (touchStartX == null) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        touchStartX = null;
        if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          stepSlide(dx < 0 ? 1 : -1);
        }
      }, { passive: true });

      // Авто-затухание интерфейса в покое (Zen-режим)
      let idleTimer = 0;
      function wakeUi() {
        document.body.classList.remove("idle");
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
          if (!ui.sheet) document.body.classList.add("idle");
        }, 3200);
      }
      ["mousemove", "pointerdown", "keydown", "touchstart"].forEach(ev => {
        document.addEventListener(ev, wakeUi, { passive: true });
      });

      wakeUi();
      render();
    })();
  </script>
</body>
</html>
